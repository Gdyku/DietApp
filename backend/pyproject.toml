[project]
name = "dietapp-backend"
version = "0.1.0"
description = "API aplikacji DietApp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
