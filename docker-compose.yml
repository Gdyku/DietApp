services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dietapp
      POSTGRES_PASSWORD: dietapp
      POSTGRES_DB: dietapp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dietapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
